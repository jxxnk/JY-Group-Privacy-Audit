name: quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint collector and tools
        run: python -m ruff check collector tools

      - name: Check formatting
        run: python -m ruff format --check collector tools

      - name: All pytest tests
        run: python -m pytest -q

      - name: Evidence v2 regression
        run: python -m unittest discover -s tools -p test_jy_evidence_v2.py -v

      - name: Selected release regression
        run: python -m unittest discover -s tools -p test_jy_closeout.py -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}